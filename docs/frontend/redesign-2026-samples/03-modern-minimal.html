<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Concept 3 — Modern Minimal · YAV2 Dashboard sample</title>
  <link rel="stylesheet" href="samples-base.css" />
  <style>
    /* CONCEPT 3 — MODERN MINIMAL: white, graphite, soft gray. Near-monochrome
       (graphite as the only "accent"), heavy type, flat borders, whitespace.
       Modern consulting / SaaS editorial feel. */
    .s-shell {
      --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F5F5F5;
      --border: #E9E9E9; --border-2: #F1F1F1; --border-strong: #D6D6D6;
      --text: #141414; --text-muted: #565656; --text-subtle: #8A8A8A; --text-faint: #B6B6B6;
      --accent: #141414; --accent-strong: #000000; --accent-soft: #F1F1F1; --accent-border: #E2E2E2; --on-accent: #FFFFFF;
      --sidebar-bg: #FFFFFF; --sidebar-text: #6A6A6A; --sidebar-text-strong: #141414;
      --sidebar-active-bg: #F2F2F2; --sidebar-active-text: #141414; --sidebar-active-ico: #141414;
      --sidebar-border: #ECECEC; --nav-active-shadow: inset 3px 0 0 #141414;
      --font-head: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --head-weight: 800; --head-size: 29px; --head-spacing: -.9px; --num-weight: 800;
      --radius: 4px; --radius-lg: 6px; --mark-radius: 5px; --ico-radius: 6px;
      --card-border: 1px solid var(--border); --card-shadow: none;
    }
    /* editorial touch: flat KPI icon wells */
    .s-shell .s-kpi-ico { background: var(--surface-2); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="samples-dashboard.js"></script>
</body>
</html>
