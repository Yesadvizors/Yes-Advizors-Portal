<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Concept 2 — Executive Blue · YAV2 Dashboard sample</title>
  <link rel="stylesheet" href="samples-base.css" />
  <style>
    /* CONCEPT 2 — EXECUTIVE BLUE: white + soft blue-gray surfaces, deep-blue
       chrome, royal-blue accent. Premium banking / institutional feel. */
    .s-shell {
      --bg: #F3F6FB; --surface: #FFFFFF; --surface-2: #EEF3FA;
      --border: #DBE5F1; --border-2: #EAF0F8; --border-strong: #C2D2E7;
      --text: #10233F; --text-muted: #45566D; --text-subtle: #74869F; --text-faint: #A7B6CA;
      --accent: #1D4ED8; --accent-strong: #1E40AF; --accent-soft: #EAF1FE; --accent-border: #BED2F5; --on-accent: #FFFFFF;
      --sidebar-bg: #0F2A5E; --sidebar-text: rgba(255,255,255,.72); --sidebar-text-strong: #FFFFFF;
      --sidebar-active-bg: rgba(255,255,255,.12); --sidebar-active-text: #FFFFFF; --sidebar-active-ico: #93B4F5;
      --sidebar-border: rgba(255,255,255,.08); --nav-active-shadow: inset 3px 0 0 #3B82F6;
      --font-head: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --head-weight: 700; --head-size: 24px; --head-spacing: -.4px; --num-weight: 700;
      --radius: 8px; --radius-lg: 12px; --mark-radius: 8px; --ico-radius: 9px;
      --card-border: 1px solid var(--border); --card-shadow: 0 1px 3px rgba(16,40,80,.07);
      --btn-shadow: 0 1px 2px rgba(29,78,216,.30);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="samples-dashboard.js"></script>
</body>
</html>
