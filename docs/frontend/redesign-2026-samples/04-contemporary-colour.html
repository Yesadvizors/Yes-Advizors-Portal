<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Concept 4 — Contemporary Colour · YAV2 Dashboard sample</title>
  <link rel="stylesheet" href="samples-base.css" />
  <style>
    /* CONCEPT 4 — CONTEMPORARY COLOUR: light neutral surfaces, sophisticated
       plum/aubergine chrome + plum accent, softly rounded. Distinctive but
       professional. */
    .s-shell {
      --bg: #FAF7FB; --surface: #FFFFFF; --surface-2: #F5EFF6;
      --border: #EBE1EC; --border-2: #F2ECF3; --border-strong: #DDCFDF;
      --text: #241826; --text-muted: #5E5060; --text-subtle: #8B7C8D; --text-faint: #BCAEBE;
      --accent: #7A2E52; --accent-strong: #632443; --accent-soft: #F7EAF1; --accent-border: #E6C9DA; --on-accent: #FFFFFF;
      --sidebar-bg: #2A1826; --sidebar-text: rgba(255,255,255,.72); --sidebar-text-strong: #FFFFFF;
      --sidebar-active-bg: rgba(255,255,255,.12); --sidebar-active-text: #FFFFFF; --sidebar-active-ico: #E6A8CC;
      --sidebar-border: rgba(255,255,255,.08); --nav-active-shadow: inset 3px 0 0 #B14E86;
      --font-head: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --head-weight: 700; --head-size: 25px; --head-spacing: -.4px; --num-weight: 700;
      --radius: 12px; --radius-lg: 16px; --mark-radius: 10px; --ico-radius: 11px;
      --card-border: 1px solid var(--border); --card-shadow: 0 2px 12px -5px rgba(60,20,50,.12);
      --btn-shadow: 0 1px 2px rgba(122,46,82,.30);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="samples-dashboard.js"></script>
</body>
</html>
