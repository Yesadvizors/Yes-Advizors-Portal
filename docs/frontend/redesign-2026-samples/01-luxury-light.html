<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Concept 1 — Luxury Light · YAV2 Dashboard sample</title>
  <link rel="stylesheet" href="samples-base.css" />
  <style>
    /* CONCEPT 1 — LUXURY LIGHT: warm ivory, charcoal type, muted gold accent,
       elegant serif headings. Premium advisory-firm feel. */
    .s-shell {
      --bg: #FBF9F4; --surface: #FFFFFF; --surface-2: #F6F1E8;
      --border: #EAE2D3; --border-2: #F1EBDD; --border-strong: #DCD1BC;
      --text: #23201B; --text-muted: #6B6252; --text-subtle: #998F77; --text-faint: #C6BBA4;
      --accent: #A67C2E; --accent-strong: #866020; --accent-soft: #F6EEDC; --accent-border: #E7D5AC; --on-accent: #FFFFFF;
      --sidebar-bg: #FCFAF5; --sidebar-text: #6B6252; --sidebar-text-strong: #23201B;
      --sidebar-active-bg: #F3EAD5; --sidebar-active-text: #866020; --sidebar-active-ico: #A67C2E;
      --sidebar-border: #EAE2D3; --nav-active-shadow: inset 3px 0 0 #A67C2E;
      --font-head: Georgia, 'Times New Roman', 'Iowan Old Style', serif;
      --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --head-weight: 600; --head-size: 27px; --head-spacing: -.2px; --num-weight: 600;
      --radius: 8px; --radius-lg: 12px; --mark-radius: 8px; --ico-radius: 9px;
      --card-border: 1px solid var(--border); --card-shadow: 0 1px 2px rgba(90,70,25,.05);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="samples-dashboard.js"></script>
</body>
</html>
