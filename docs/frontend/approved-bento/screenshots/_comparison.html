<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<style>
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #EEF1F5; padding: 20px; }
  h2 { font-size: 15px; margin: 0 0 8px; color: #16213A; }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .col { flex: 1; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; padding: 4px 10px; border-radius: 6px; margin-bottom: 8px; }
  .ref { background: #E7F0FF; color: #1D4ED8; }
  .imp { background: #EDF7F0; color: #157A39; }
  img { width: 100%; height: auto; display: block; border: 1px solid #D8DEE8; border-radius: 8px; }
</style></head>
<body>
  <div class="row">
    <div class="col"><span class="tag ref">APPROVED REFERENCE · 1672×941</span><img src="./reference.png" alt="approved reference" /></div>
    <div class="col"><span class="tag imp">IMPLEMENTATION · 1664px</span><img src="./impl-1664.png" alt="implementation" /></div>
  </div>
</body></html>
